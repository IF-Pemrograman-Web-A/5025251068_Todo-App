    <title>Simply Todo</title>
</head>
<body>
    <header>
        <h2>SimplyTodo</h2>
        <p>Simply a todo list</p>
    </header>

    <main>            
        <section class="left-panel">
            <div>
                <div>
                    <h2 class="left-panel-title">Active Tasks</h2>
                </div>
                <ul class="task-list">

                </ul>
            </div>
        </section>

        <aside class="right-panel">
            <div class="task-details">
                <h2 class="task-details-title">Current Task Details</h2>
                <div class="task-details-details">
                    <h3 class="task-details-task-name"><strong>Task Name: </strong></h3>
                    <p class="task-details-task-desc"><strong>Tag: </strong>
                        <br>
                        <br>
                        
                    </p>
                    <p class="task-details-task-deadline"><strong>Deadline: </strong><time></time></p>
                </div>
            </div>
            <h2 class="right-panel-title">Add New Task</h2>
            <div class="add-new-tasks">
                <form action="#" class="new-tasks-form">
                    <div class="form-group">
                        <label for="form-task-name">Task Name:</label>
                        <input type="text" class="form-task-name" id="form-task-name">
                    </div>
                    <div class="form-group">
                        <label for="form-task-tag">Task Tag:</label>
                        <input type="text" class="form-task-tag" id="form-task-tag">
                    </div>
                    <div class="form-group">
                        <label for="form-task-desc">Description:</label>
                        <textarea type="textarea" class="form-task-desc" id="form-task-desc"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="form-task-deadline">Deadline:</label>
                        <input type="date" class="form-task-deadline" id="form-task-deadline">
                    </div>
                    <button type="submit" class="form-task-button"><h2><b>Add Task</b></h2></button>
                </form>
            </div>
        </aside>
    </main>
